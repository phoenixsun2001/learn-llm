services:
  # Frontend: React SPA served by nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_ADMIN_TOKEN=${VITE_ADMIN_TOKEN:-learn-llm-admin}
    container_name: learn-llm-frontend
    ports:
      - "80:80"
    volumes:
      - ./content:/usr/share/nginx/html/content
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - learn-llm

  # Backend: Pipeline Admin Dashboard (FastAPI)
  backend:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: learn-llm-backend
    ports:
      - "8400:8400"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./content:/app/content
      - ./pipeline/data:/app/data
      - ./frontend/src/data:/app/frontend-data
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-learn-llm-admin}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - PIPELINE_OUTPUT_DIR=/app/content/materials/
      - CONTENT_ROOT=/app/content
      - FRONTEND_DATA_DIR=/app/frontend-data/
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ZHIPU_API_BASE=${ZHIPU_API_BASE:-https://open.bigmodel.cn/api/coding/paas/v4}
      - ZHIPU_MODEL=${ZHIPU_MODEL:-GLM-4.7}
    networks:
      - learn-llm

networks:
  learn-llm:
    driver: bridge
